<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#ff6a55">
<title>Pháo tay banking</title>
<style>
  :root {
    --bg-top: #ff8a3d;
    --bg-bottom: #ff3d7f;
    --card: #ffffff;
    --ink: #1f2937;
    --muted: #6b7280;
    --accent: #f97316;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(160deg, var(--bg-top), var(--bg-bottom));
    color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
  }
  .card {
    position: relative; z-index: 2;
    width: min(92vw, 420px);
    background: var(--card);
    border-radius: 28px;
    padding: 28px 22px 24px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(120, 20, 40, .25);
  }
  .brand { font-size: 13px; font-weight: 800; letter-spacing: .12em; color: var(--accent); }
  h1 { font-size: 24px; margin: 6px 0 4px; }
  .sub { color: var(--muted); font-size: 15px; margin: 0 0 22px; }
  .clap {
    width: 190px; height: 190px; border-radius: 50%;
    border: none; cursor: pointer;
    font-size: 92px; line-height: 1;
    background: radial-gradient(circle at 35% 30%, #fff3e6, #ffd2a8 70%, #ffb57a);
    box-shadow: 0 10px 0 #e8894a, 0 18px 30px rgba(249, 115, 22, .35);
    transition: transform .06s ease, box-shadow .06s ease;
  }
  .clap:active, .clap.hit { transform: translateY(6px) scale(.97); box-shadow: 0 4px 0 #e8894a, 0 8px 16px rgba(249, 115, 22, .3); }
  .count { font-size: 44px; font-weight: 800; margin: 22px 0 0; font-variant-numeric: tabular-nums; }
  .count small { display: block; font-size: 14px; font-weight: 500; color: var(--muted); }
  .msg { min-height: 24px; margin: 12px 0 0; font-weight: 700; color: var(--accent); }
  .total { margin-top: 16px; font-size: 13px; color: var(--muted); }
  canvas { position: fixed; inset: 0; z-index: 3; pointer-events: none; }
  .float {
    position: fixed; z-index: 4; pointer-events: none; font-size: 34px;
    animation: rise 1s ease-out forwards;
  }
  @keyframes rise {
    from { opacity: 1; transform: translate(-50%, 0) scale(.8); }
    to { opacity: 0; transform: translate(calc(-50% + var(--dx)), -160px) scale(1.4); }
  }
  .shake { animation: shake .25s linear; }
  .shake-big { animation: shake-big .5s linear; }
  @keyframes shake {
    0%, 100% { transform: translate(0, 0); }
    25% { transform: translate(-4px, 2px) rotate(-.6deg); }
    50% { transform: translate(4px, -2px) rotate(.6deg); }
    75% { transform: translate(-3px, -1px); }
  }
  @keyframes shake-big {
    0%, 100% { transform: translate(0, 0); }
    10%, 50%, 90% { transform: translate(-10px, 4px) rotate(-1.5deg); }
    30%, 70% { transform: translate(10px, -4px) rotate(1.5deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .shake, .shake-big, .float { animation: none; }
  }
</style>
</head>
<body>
<canvas id="fx"></canvas>
<main class="card" id="card">
  <div class="brand">PHÁO TAY BANKING</div>
  <h1>Gửi admin một tràng pháo tay</h1>
  <p class="sub">Bấm càng nhiều, admin càng vui. Ẩn danh 100% 🤫</p>
  <button class="clap" id="clap" aria-label="Vỗ tay">👏</button>
  <div class="count"><span id="mine">0</span><small>tràng pháo tay của bạn</small></div>
  <div class="msg" id="msg"></div>
  <div class="total">Admin đã nhận tổng cộng <b id="total">__CLAP_TOTAL__</b> tràng pháo tay</div>
</main>
<script>
(() => {
  const ENDPOINT = "__CLAP_ENDPOINT__";
  const MILESTONES = {
    1: "Admin đã nghe thấy 👂",
    10: "Nóng tay rồi đó 🔥",
    25: "Admin bắt đầu rưng rưng 🥹",
    50: "Tay bạn làm bằng gì vậy? 😳",
    100: "Huyền thoại vỗ tay 🏆",
    200: "Admin xin nhận, đủ ấm lòng rồi 🙏",
  };
  const COLORS = ["#f97316", "#ff3d7f", "#facc15", "#22c55e", "#3b82f6", "#a855f7"];

  const btn = document.getElementById("clap");
  const mineEl = document.getElementById("mine");
  const totalEl = document.getElementById("total");
  const msgEl = document.getElementById("msg");
  const card = document.getElementById("card");
  const canvas = document.getElementById("fx");
  const ctx = canvas.getContext("2d");

  let mine = 0;
  let unsent = 0;
  let sending = false;
  let particles = [];

  function resize() {
    canvas.width = innerWidth * devicePixelRatio;
    canvas.height = innerHeight * devicePixelRatio;
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  }
  addEventListener("resize", resize);
  resize();

  // Pháo hoa: 1 chùm hạt bung ra từ (x, y)
  function burst(x, y, n) {
    for (let i = 0; i < n; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 2 + Math.random() * 6;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 2,
        life: 60 + Math.random() * 30,
        size: 3 + Math.random() * 4,
        color: COLORS[(Math.random() * COLORS.length) | 0],
        rect: Math.random() < .5,
        spin: Math.random() * 6,
      });
    }
    if (particles.length === n) requestAnimationFrame(tick);
  }

  function tick() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    particles = particles.filter((p) => p.life > 0);
    for (const p of particles) {
      p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.vx *= 0.99; p.life--; p.spin += 0.2;
      ctx.globalAlpha = Math.min(1, p.life / 30);
      ctx.fillStyle = p.color;
      if (p.rect) {
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.spin);
        ctx.fillRect(-p.size, -p.size / 2, p.size * 2, p.size);
        ctx.restore();
      } else {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size / 1.5, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    if (particles.length) requestAnimationFrame(tick);
  }

  function floatEmoji(x, y) {
    const el = document.createElement("div");
    el.className = "float";
    el.textContent = Math.random() < .8 ? "👏" : ["🎉", "✨", "💖"][(Math.random() * 3) | 0];
    el.style.left = x + "px";
    el.style.top = y + "px";
    el.style.setProperty("--dx", (Math.random() * 80 - 40) + "px");
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1000);
  }

  function shake(big) {
    const cls = big ? "shake-big" : "shake";
    card.classList.remove("shake", "shake-big");
    void card.offsetWidth; // chạy lại animation
    card.classList.add(cls);
    // iPhone không hỗ trợ rung, Android thì rung thật
    if (navigator.vibrate) navigator.vibrate(big ? [60, 40, 60] : 25);
  }

  function clap(event) {
    mine++;
    unsent++;
    mineEl.textContent = mine;

    const rect = btn.getBoundingClientRect();
    const x = event && event.clientX ? event.clientX : rect.left + rect.width / 2;
    const y = event && event.clientY ? event.clientY : rect.top + rect.height / 2;
    const big = MILESTONES[mine] !== undefined || mine % 50 === 0;

    burst(x, y, big ? 90 : 26);
    if (big) {
      burst(innerWidth * .2, innerHeight * .3, 60);
      burst(innerWidth * .8, innerHeight * .25, 60);
    }
    floatEmoji(x, y);
    shake(big);
    if (MILESTONES[mine]) msgEl.textContent = MILESTONES[mine];

    btn.classList.add("hit");
    setTimeout(() => btn.classList.remove("hit"), 70);
  }

  // Gom các cú vỗ tay rồi gửi 1 lần/giây
  async function flush() {
    if (sending || unsent === 0) return;
    sending = true;
    const count = unsent;
    unsent = 0;
    try {
      const res = await fetch(ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ count }),
      });
      const data = await res.json();
      totalEl.textContent = data.total;
      if (data.accepted < count) msgEl.textContent = "Chậm lại tí, admin nghe không kịp 😅";
    } catch (e) {
      unsent += count; // mất mạng: giữ lại, lần sau gửi tiếp
    } finally {
      sending = false;
    }
  }
  setInterval(flush, 1000);
  addEventListener("pagehide", () => {
    if (unsent > 0 && navigator.sendBeacon) {
      navigator.sendBeacon(ENDPOINT, new Blob([JSON.stringify({ count: unsent })], { type: "application/json" }));
      unsent = 0;
    }
  });

  btn.addEventListener("click", clap);
})();
</script>
</body>
</html>
